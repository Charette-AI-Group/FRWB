[project]
name = "frwb"
version = "1.0.0"
description = "File Rename Processing Workbench (FRWB) - batch rename files with patterns, counters and dates (PySide6)"
license = { text = "MIT" }
requires-python = ">=3.14"
dependencies = [
    "PySide6>=6.6,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-qt>=4.4,<5",
    "ruff>=0.4,<1",
]
# Only needed to produce a standalone build; see tools/buildExe.py. Kept out
# of dev so a checkout that only runs the app and the tests stays smaller.
build = [
    "pyinstaller>=6.16,<7",
    # macOS only, and only at build time: PyInstaller renders the .icns the
    # bundle needs from the 1024 px PNG through Pillow.
    "pillow>=10,<12; sys_platform == 'darwin'",
]

[project.scripts]
frwb = "frwb.main:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
qt_api = "pyside6"
python_files = ["test*.py"]
python_functions = ["test*"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/frwb"]
